<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>2nd Quarter | Drill 2</title>
</head>
<style>

    body {

background-image: url(https://i.pinimg.com/1200x/59/0e/e8/590ee800ea0447f4ecac398acac4925d.jpg);
background-size: cover;
background-position: center;
background-attachment: fixed;
    }


</style>

<body>
    <div class="container mt-5">
        <h3 class="mb-4">Add new fighter to the tournament!</h3>
        <form class="mb-4">
            <div class="mb-3">
                <input type="text" id="first_name" class="form-control" placeholder="Enter fighter's first name">
            </div>
            <div class="mb-3">
                <input type="text" id="last_name" class="form-control" placeholder="Enter fighter's last name">
            </div>
            <input type="button" value="Submit" py-click="add_fighter" class="btn btn-primary">
        </form>
        <div id="output" class="p-3 rounded" style="background-color: black; color: chartreuse; font-size: 20px;"></div>
    </div>

    <py-script src="main.py"></py-script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
